[build-system]
requires = ['setuptools>=65', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'clalign'
version = '1.0'
description = ''
readme = ''
requires-python = '>=3.12.7'
authors = [
    {name = 'yourh', email = 'yourh@nankai.com'}
]
license = {text = 'Custom'}
classifiers = []
dependencies = [
    'numpy>=2.2.5',
    'scipy>=1.16.0',
    'biopython>=1.85',
    'torch==2.7.1+cu128',
    'transformers>=4.53.0',
    'sentencepiece>=0.2.0',
    'protobuf>=6.31.1',
    'peft>=0.15.2',
    'numba>=0.61.2',
    'click>=8.2.1',
    'logzero>=1.7.0',
    'tqdm>=4.67.1',
    'torch-geometric>=2.6.1',
    'pyg_lib',
    'torch_scatter',
    'torch_sparse',
    'torch_cluster',
    'torch_spline_conv',
    'biotite>=1.3.0'
]

[project.urls]
homepage = 'https://github.com/yourh/CLAlign'

[project.scripts]
clalign = 'clalign.main:main'

[tool.setuptools.package-data]
clalign = ['CLAlign-ProtT5/**/*', 'CLAlign-ProstT5/**/*', 'CLAlign-ESMIF/**/*']

[tool.setuptools.packages.find]
where = ['src']
include = ['clalign*', 'esm*']
